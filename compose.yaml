services:
  shellguard:
    build: .
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-7860}:7860"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 7860
    volumes:
      - shellguard-runtime:/app/.runtime
    restart: unless-stopped
    init: true

volumes:
  shellguard-runtime:
