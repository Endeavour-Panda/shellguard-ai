; Deployment root: /root/autodl-tmp/shellguard-ai
; Create logs/ and .runtime/ before starting. Secrets are loaded from .env.
[unix_http_server]
file=/root/autodl-tmp/shellguard-ai/.runtime/supervisor.sock
chmod=0700
[supervisord]
logfile=/root/autodl-tmp/shellguard-ai/logs/supervisor.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/root/autodl-tmp/shellguard-ai/.runtime/supervisor.pid
childlogdir=/root/autodl-tmp/shellguard-ai/logs
[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=unix:///root/autodl-tmp/shellguard-ai/.runtime/supervisor.sock
[program:shellguard]
directory=/root/autodl-tmp/shellguard-ai
command=/root/autodl-tmp/shellguard-ai/.venv-server/bin/python -u app.py
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=30
environment=CUDA_VISIBLE_DEVICES="0",HF_HUB_OFFLINE="1",TOKENIZERS_PARALLELISM="false",OMP_NUM_THREADS="4",GRADIO_ANALYTICS_ENABLED="False"
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/shellguard-ai/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
